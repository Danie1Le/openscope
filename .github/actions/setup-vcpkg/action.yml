name: Set up vcpkg
description: >
  Fetches vcpkg at the builtin-baseline commit from vcpkg.json, exports VCPKG_ROOT for later
  steps, and restores vcpkg's binary cache.

runs:
  using: composite
  steps:
    - name: Restore vcpkg binary cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{ runner.os }}-${{ env.CXX }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ runner.os }}-${{ env.CXX }}-
    - name: Fetch and bootstrap vcpkg
      shell: bash
      run: |
        export VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
        echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
        commit=$(jq -r '."builtin-baseline"' vcpkg.json)
        git init --quiet "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" fetch --quiet --depth 1 https://github.com/microsoft/vcpkg "$commit"
        git -C "$VCPKG_ROOT" checkout --quiet FETCH_HEAD
        "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

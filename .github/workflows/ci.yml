name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share a group per ref, so a newer push cancels the superseded run. Pushes to main
  # get a group per commit: a shared group would let GitHub drop a queued run when another arrives.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          if [ -n "$files" ]; then clang-format-18 --dry-run --Werror $files; fi

  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC debug, preset: debug, cxx: g++-14 }
          - { name: GCC release, preset: release, cxx: g++-14 }
          # clang-tidy runs on every translation unit as it compiles; .clang-tidy makes findings errors.
          - name: Clang debug + clang-tidy
            preset: debug
            cxx: clang++-18
            configure-args: -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
          - { name: ASan + UBSan, preset: asan, cxx: clang++-18 }
          - { name: TSan, preset: tsan, cxx: clang++-18 }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-vcpkg
      # The runner's high ASLR entropy breaks TSan ("unexpected memory mapping").
      - if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure-args }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: Fuzz smoke (60 s)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-18 # The fuzz preset pins it; set here so the vcpkg cache key matches.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-vcpkg
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      # Inputs up to 8 KB cross the 4 KB line limit, and a seed starts there. New inputs go to the
      # scratch corpus (the first directory). A crash or a 10 s hang fails the job.
      - name: Fuzz the execute-line entry point
        run: |
          mkdir -p fuzz-corpus fuzz-artifacts
          build/fuzz/fuzz/execute_line_fuzzer -max_total_time=60 -max_len=8192 -timeout=10 \
            -dict=fuzz/scpi.dict -artifact_prefix=fuzz-artifacts/ fuzz-corpus fuzz/corpus
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/

  benchmark:
    # Reported, not a merge gate: shared runners are too noisy for timing thresholds.
    # docs/benchmarks.md records numbers from a fixed machine.
    name: Benchmarks (reported)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # CC builds the KissFFT reference (bench/CMakeLists.txt) with the compiler of our own code.
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-vcpkg
      - run: cmake --preset benchmark
      - run: cmake --build --preset benchmark
      - name: FFT against KissFFT
        # Explicit shell: bash adds -o pipefail, so a crashing benchmark fails the step instead of
        # leaving a truncated summary behind tee's exit status.
        shell: bash
        run: |
          build/benchmark/bench/fft_benchmark | tee benchmark.txt
          { echo '```'; cat benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

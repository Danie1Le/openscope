name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VCPKG_ROOT: ${{ github.workspace }}/../vcpkg

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          if [ -n "$files" ]; then clang-format-18 --dry-run --Werror $files; fi

  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC debug, preset: debug, cxx: g++-14 }
          - { name: GCC release, preset: release, cxx: g++-14 }
          # clang-tidy runs on every translation unit as it compiles; .clang-tidy makes findings errors.
          - name: Clang debug + clang-tidy
            preset: debug
            cxx: clang++-18
            configure-args: -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
          - { name: ASan + UBSan, preset: asan, cxx: clang++-18 }
          - { name: TSan, preset: tsan, cxx: clang++-18 }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-vcpkg
      # The runner's high ASLR entropy breaks TSan ("unexpected memory mapping").
      - if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure-args }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

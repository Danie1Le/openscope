name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share a group per ref, so a newer push cancels the superseded run. Pushes to main
  # get a group per commit: a shared group would let GitHub drop a queued run when another arrives.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: clang-format
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          if [ -n "$files" ]; then clang-format-18 --dry-run --Werror $files; fi
      - name: ruff
        working-directory: python
        run: |
          ruff="pipx run --spec $(grep '^ruff==' requirements-dev.txt) ruff"  # The pinned version.
          $ruff check --output-format=github .
          $ruff format --check --diff .

  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # pytest: also run the Python suite against the engine the job built. coverage: also gate
          # the line coverage of the ctest run (the coverage preset pins clang++-18).
          - { name: GCC debug, preset: debug, cxx: g++-14 }
          - { name: GCC release, preset: release, cxx: g++-14, pytest: true }
          # clang-tidy runs on every translation unit as it compiles; .clang-tidy makes findings errors.
          - name: Clang debug + clang-tidy
            preset: debug
            cxx: clang++-18
            configure-args: -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
          - { name: ASan + UBSan, preset: asan, cxx: clang++-18, pytest: true }
          - { name: TSan, preset: tsan, cxx: clang++-18 }
          - { name: Coverage (gate), preset: coverage, cxx: clang++-18, coverage: true }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-vcpkg
      # The runner's high ASLR entropy breaks TSan ("unexpected memory mapping").
      - if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure-args }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      # The client's tests and the TCP suite (spec seam 2): every test starts the engine built
      # above on a free port and checks it exits cleanly, so the ASan job also checks the server.
      # pytest's summary (failures first) goes on the run's page.
      - name: pytest
        if: matrix.pytest
        working-directory: python
        env:
          OPENSCOPE_ENGINE_PATH: ${{ github.workspace }}/build/${{ matrix.preset }}/src/openscope-engine
        # Explicit shell: bash adds -o pipefail, so failing tests are caught through tee.
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-dev.txt -e .
          status=0
          "$RUNNER_TEMP/venv/bin/pytest" -ra --junitxml=pytest-${{ matrix.preset }}.xml \
            | tee pytest.txt || status=$?
          { echo "### pytest (${{ matrix.preset }})"; echo '```'
            sed -n '/short test summary info/,$p' pytest.txt | grep . || tail -n 1 pytest.txt
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Publish pytest results (JUnit XML)
        if: matrix.pytest && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ matrix.preset }}
          path: python/pytest-${{ matrix.preset }}.xml
      # Fails when any area is below the threshold in tools/coverage_gate.py, which also names the
      # areas and files. Explicit shell: bash adds -o pipefail, so the gate's exit status survives tee.
      - name: Gate line coverage (trigger, measurement, SCPI parser)
        if: matrix.coverage
        shell: bash
        run: |
          python3 -m unittest discover -s tools
          status=0
          python3 -I tools/coverage_gate.py | tee coverage.txt || status=$?
          { echo "### Line coverage"; echo '```'; sed -n '/^Line coverage by area/,$p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Publish the llvm-cov report
        if: matrix.coverage && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-cov-report
          path: build/coverage/coverage-report.txt

  fuzz:
    name: Fuzz smoke (60 s)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-18 # The fuzz preset pins it; set here so the vcpkg cache key matches.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-vcpkg
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      # Inputs up to 8 KB cross the 4 KB line limit, and a seed starts there. New inputs go to the
      # scratch corpus (the first directory). A crash or a 10 s hang fails the job.
      - name: Fuzz the execute-line entry point
        run: |
          mkdir -p fuzz-corpus fuzz-artifacts
          build/fuzz/fuzz/execute_line_fuzzer -max_total_time=60 -max_len=8192 -timeout=10 \
            -dict=fuzz/scpi.dict -artifact_prefix=fuzz-artifacts/ fuzz-corpus fuzz/corpus
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/

  benchmark:
    # Reported, not a merge gate: shared runners are too noisy for timing thresholds.
    # docs/benchmarks.md records numbers from a fixed machine.
    name: Benchmarks (reported)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # CC builds the KissFFT reference (bench/CMakeLists.txt) with the compiler of our own code.
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-vcpkg
      - run: cmake --preset benchmark
      - run: cmake --build --preset benchmark
      - name: Google Benchmarks (every *_benchmark target)
        # Explicit shell: bash adds -o pipefail, so a crashing benchmark fails the step instead of
        # leaving a truncated summary behind tee's exit status.
        shell: bash
        run: |
          mkdir benchmark-results
          for binary in build/benchmark/bench/*_benchmark; do
            benchmark=$(basename "$binary")
            "$binary" --benchmark_out="benchmark-results/$benchmark.json" --benchmark_out_format=json \
              | tee "benchmark-results/$benchmark.txt"
            { echo "### $benchmark"; echo '```'; cat "benchmark-results/$benchmark.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: live_run rejects a bad argument
        # Each must exit 2 with the usage, never run on defaults under the wrong heading. Unquoted
        # on purpose: each case splits into its arguments, and `;` stays part of the text.
        shell: bash
        run: |
          for bad in "0" "1 0" "1 1E6 abc" "1 1E6 0" "1 1E6 -5" "1 1E6 1048577" "1 1E6 99999999999" \
                     "1 1E6 1000;:*RST" "1 nan" "1 1E6 10 extra"; do
            status=0
            build/benchmark/bench/live_run $bad > /dev/null 2>&1 || status=$?
            if [ "$status" -ne 2 ]; then echo "::error::live_run $bad exited $status, not 2"; exit 1; fi
          done
      - name: Live mode at 4 channels x 1 MS/s with the longest record (NFR-1)
        # Reported like the rest: dropped blocks show in the table, they do not fail the job.
        shell: bash
        run: |
          { lscpu | grep -E '^(Model name|CPU\(s\)):'; build/benchmark/bench/live_run 20 1E6 1048576; } \
            | tee benchmark-results/live_run.txt
          { echo "### live_run (20 s, 4 x 1048576 points)"; echo '```'; cat benchmark-results/live_run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: benchmark-results/
